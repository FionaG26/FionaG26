<svg viewBox="0 0 100 100" width="100" height="100" xmlns="http://w3.org">
  <style>
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .helix { transform-origin: 50px 50px; animation: spin 12s infinite linear; }
  </style>
  <g class="helix">
    <path d="M 30,20 Q 50,50 70,80" stroke="#00FFCC" stroke-width="3" fill="none" stroke-dasharray="4 2"/>
    <path d="M 70,20 Q 50,50 30,80" stroke="#8ab4f8" stroke-width="3" fill="none" stroke-dasharray="4 2"/>
    <line x1="33" y1="25" x2="67" y2="25" stroke="#00FFCC" stroke-width="2" opacity="0.7"/>
    <line x1="38" y1="35" x2="62" y2="35" stroke="#8ab4f8" stroke-width="2" opacity="0.7"/>
    <line x1="45" y1="45" x2="55" y2="45" stroke="#00FFCC" stroke-width="2" opacity="0.7"/>
    <line x1="45" y1="55" x2="55" y2="55" stroke="#8ab4f8" stroke-width="2" opacity="0.7"/>
    <line x1="38" y1="65" x2="62" y2="65" stroke="#00FFCC" stroke-width="2" opacity="0.7"/>
    <line x1="33" y1="75" x2="67" y2="75" stroke="#8ab4f8" stroke-width="2" opacity="0.7"/>
  </g>
</svg>
